[project]
name = "kicad-lab-library"
version = "1.0.0"
description = "Aharoni Lab KiCad Component Library"
requires-python = ">=3.8"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
# symbols/ and footprints/ are KiCad data dirs, not Python packages;
# without this, setuptools flat-layout auto-discovery refuses to build.
packages = ["validator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]
